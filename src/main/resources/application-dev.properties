# =========================
# DATABASE CONFIG
# =========================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mydatabase?useSSL=false&serverTimezone=UTC}

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD:mysql}

spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}


# =========================
# JPA / HIBERNATE
# =========================

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL:update}

spring.jpa.show-sql=${SHOW_SQL:true}

spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}


# =========================
# KAFKA CONFIG
# =========================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:order-group}

spring.kafka.consumer.auto-offset-reset=${KAFKA_OFFSET_RESET:earliest}

spring.kafka.consumer.key-deserializer=${KAFKA_KEY_DESERIALIZER:org.apache.kafka.common.serialization.StringDeserializer}

spring.kafka.consumer.value-deserializer=${KAFKA_VALUE_DESERIALIZER:org.springframework.kafka.support.serializer.JsonDeserializer}

spring.kafka.consumer.properties.spring.json.trusted.packages=${KAFKA_TRUSTED_PACKAGES:*}

spring.kafka.consumer.properties.spring.json.use.type.headers=${KAFKA_USE_TYPE_HEADERS:false}

spring.kafka.consumer.properties.spring.json.value.default.type=${KAFKA_DEFAULT_TYPE:load_service.entity.DOrder}